<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Deep Space Anomaly | Dharmith Kishan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: #040c18;
      color: #e8f4ff;
      font-family: 'Outfit', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      overflow: hidden;
      position: relative;
    }
    .space-bg {
      position: absolute; inset:0;
      background: radial-gradient(circle at 50% 50%, rgba(29,106,232,0.15) 0%, rgba(4,12,24,0.95) 80%);
      z-index: 1;
    }
    .card {
      position: relative; z-index: 2;
      max-width: 580px;
      padding: 3rem 2.5rem;
      background: rgba(14,40,80,0.45);
      border: 1px solid rgba(59,130,246,0.25);
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6), 0 0 50px rgba(59,130,246,0.15);
    }
    .badge {
      display: inline-block;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.78rem;
      color: #22d3ee;
      background: rgba(6,182,212,0.12);
      border: 1px solid rgba(6,182,212,0.3);
      padding: 0.35rem 0.9rem;
      border-radius: 50px;
      margin-bottom: 1.5rem;
      letter-spacing: 0.1em;
    }
    .code {
      font-size: 6rem;
      font-weight: 900;
      font-family: 'JetBrains Mono', monospace;
      line-height: 1;
      background: linear-gradient(135deg, #3b82f6, #60a5fa, #22d3ee);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 1rem;
      text-shadow: 0 0 35px rgba(59,130,246,0.5);
    }
    h1 {
      font-size: 1.6rem;
      font-weight: 800;
      margin-bottom: 0.75rem;
    }
    p {
      color: #7b9fc7;
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.85rem 1.8rem;
      border-radius: 50px;
      background: linear-gradient(135deg, #1d6ae8, #06b6d4);
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      transition: all 0.3s ease;
      box-shadow: 0 0 25px rgba(59,130,232,0.4);
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 35px rgba(6,182,212,0.6);
    }
  </style>
</head>
<body>
  <div class="space-bg"></div>
  <div class="card">
    <div class="badge">DEEP_SPACE_ANOMALY // 404</div>
    <div class="code">404</div>
    <h1>Sector Coordinates Unreachable</h1>
    <p>You have drifted beyond the charted perimeter of the portfolio galaxy. Return to safe orbit.</p>
    <a href="/" class="btn">Return to Galactic Core</a>
  </div>
</body>
</html>
